[package]
name = "doom-server"
version = "0.1.0"
edition = "2021"
default-run = "doom-server"

[dependencies]
doom-protocol = { path = "../doom-protocol" }
valence = { git = "https://github.com/Daxanius/valence.git", branch = "main", features = [
    "inventory",
    "network",
    "player_list",
    "command",
] }
ipc-channel = "0.20.2"
async-trait = "0.1.89"
rand = "0.9.2"

[build-dependencies]
walkdir = "2"
zip = "7.1.0"
sha1 = "0.10"
reqwest = { version = "0.13.1", features = ["blocking"] }
